weight = 3
description = "Tencent hysandbox hostnames"

# ── Evasion and exfiltration seen in published incidents ───────────────────
# Reconstructed from the write-ups the file header cites. Never fetched.
[[rule]]
id = "exploit.double_encoded_path"
kind = "exploit"
tactic = "T4"
target = "url"
# A percent escape surviving inside a path segment after the engine decoded
# the URL once: `F%2561cts` decodes to `F%61cts`, so `%61` (`a`) is still
# there, where a normally once-encoded path would be plain text. Only escapes
# of a printable graphic character (`%25`-`%7a`, so not `%20` space) count, so
# `annual%2520report` (a double-encoded space) is left alone.
pattern = "/[a-z0-9_.~-]*%(2[5-9a-f]|[3-6][0-9a-f]|7[0-9a])"
weight = 4
significant = true
description = "Double-encoded path segment (F%2561cts -> F%61cts), an input-filter evasion"

[[rule]]
id = "exploit.double_encoded_meta"
kind = "exploit"
tactic = "T4"
target = "param_value"
# An injection metacharacter (`< > ' " ( )`) left percent-encoded in a value
# that the engine already decoded once: it was double-encoded to survive one
# layer of decoding (`%253Cscript%253E` arrives as `%3Cscript%3E`). An
# ordinary once-encoded value decodes to the character itself, so this fires
# only on the surviving escape of a deliberate double-encoding.
pattern = "%(3[cde]|27|22|28|29)"
weight = 4
significant = true
description = "Double-encoded injection metacharacter in a parameter value (%253C -> %3C)"

[[rule]]
id = "antibot.incapsula"
kind = "anti_bot"
tactic = "T3"
target = "url"
pattern = "_Incapsula_Resource"
weight = 3
description = "Imperva Incapsula anti-bot resource requested directly"

[[rule]]
id = "exfil.httpbin_data"
kind = "exfil"
tactic = "T7"
target = "url"
# A long value on a `d`, `e`, `data`, `out`, `resp` or `result` parameter of an
# echo service: a program sending a fetched response or error text back out by
# putting it in the URL it navigates to. Ordinary echo calls carry short
# values; this wants 40 characters or more.
pattern = "(httpbin\\.org|httpbun\\.(com|org))/(get|anything)[^#]*[?&](d|e|data|out|resp|result)=[^&#]{40,}"
weight = 3
significant = true
description = "Fetched data sent back inside an echo-service URL (httpbin get?d=...)"

[[rule]]
id = "marker.oai_prefix"
kind = "agent_marker"
artifact = true
group = "run_tag"
target = "url"
# `OAI_` or `CHATGPT_` followed by an upper-case/numeric identifier, in a tag
# or `tok` value (`tok=OAI_META_1312`, `CHATGPT_1610_2000_125192`). Matched
# case-sensitively: ordinary words are not upper case.
pattern = "(?-i:\\bOAI_[A-Z][A-Z0-9_]+|\\bCHATGPT_[0-9][0-9A-Z_]+)"
weight = 3
description = "OAI_/CHATGPT_ run tag (OpenAI-UNCTAD, US/Canada government reports)"

# ── Declared agent identity (FM-7.11): evidence, never fetched ─────────────
[[rule]]
id = "selfid.signature_agent"
kind = "self_id"
artifact = true
target = "header"
# Web Bot Auth message-signature headers. Their presence shows the client
# signs its requests; the key is never fetched (the URI is agent-supplied).
pattern = "^signature-agent:|^signature-input:.*\\bkeyid="
weight = 1
description = "Web Bot Auth signature headers (Signature-Agent / Signature-Input)"

[[rule]]
id = "header.agent_ua"
kind = "header"
artifact = true
target = "user_agent"
# User agents that name a published agent product. A product that signs its
# requests but appears here with no signature is a counter-signal the case
# records; on its own this only says an agent may have sent the request.
pattern = "ChatGPT-User|OAI-SearchBot|GPTBot|ClaudeBot|Claude-User|Claude-SearchBot|PerplexityBot|Perplexity-User|Google-CloudVertexBot|Bytespider|Amazonbot|Meta-ExternalAgent"
weight = 1
description = "Known agent product in the user agent (FM-7.11 declared identity)"

