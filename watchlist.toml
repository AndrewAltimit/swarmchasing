# Sources `swarmchase watch` collects from. Index records only: captures are never opened.
# Runs are incremental: only records not seen before are stored, and the last
# `analysis_window_days` of records are analysed together each run.
#
# Every source needs a rationale: which agent behaviour it catches, which rule
# it feeds, and what its noise looks like. A source with no rationale gets cut.
min_interval_secs = 3
overlap_days = 3            # re-check this far back for late-indexed captures
analysis_window_days = 30
retain_days = 180           # delete runs and stored records older than this (docs/policies.md)
contained_after_days = 14   # digest proposes "contained" for an active notice after this long with no matching record
http_cache_ttl_secs = 3600  # reuse cached responses (<data>/cache/http) this long, then revalidate; 0 = off
collect_deadline_mins = 90  # sources not started by then are deferred to the next run (within watch.yml's 150-minute job); 0 = off

# What the watch may do on its own about the attention queue
# (docs/reference/watch.md#autonomy). Shadow only logs what a level would have
# done, to <data>/autonomy.ndjson; the dashboard reads that log against the
# admin's later labels and cases. Only `interrupt` can be on, and on it only
# raises the digest's priority. Nothing here sends, publishes or opens a case.
[autonomy]
interrupt = "shadow"        # off | shadow | on
watch_harder = "shadow"     # off | shadow
draft_case = "shadow"       # off | shadow
interrupts_per_day = 3
#
# Kinds: wayback | arquivo | urlquery | commoncrawl | urlscan | memento |
# gharchive | npm | pypi | ctlog | wellknown | mcp | wikimedia | hackernews |
# bluesky | ghsearch | clawhub (docs/reference/watch.md#source-kinds).
# Every source's terms of use are summarised in its rationale, with the URL.
#
# The streamed relay sources (gharchive-relays, wikimedia-relay-links,
# hackernews-relay-links, bluesky-relay-links, clawhub-relay-links) share one list of substrings,
# taken from the relay, carrier, marker and callback rules in
# rules/default.toml: relay and carrier hosts in the form a wrapped URL
# takes, run tags, and callback hosts. Callback hosts are only matched as
# text inside the records these sources find; no channel is read. A test
# (`watch::check`) fails when a relay or carrier rule has no substring here,
# unless it names why the rule is left out. The list:
# //r.jina.ai/http  //markdown.new/  //pure.md/  //defuddle.md/
# api.allorigins.win/  corsproxy.io/  cors-anywhere  thingproxy
# codetabs.com/v1/proxy  api.microlink.io/  httpbin.org/base64
# httpbin.org/anything  httpbin.org/redirect-to  //httpbun.com/
# //httpbun.org/  livecodes.io/?  .e2b.app  .modal.run  .proxy.daytona.work
# production-sfo.browserless.io  production-lon.browserless.io
# production-ams.browserless.io  chrome.browserless.io  connect.browserbase.com
# connect.steel.dev  connect.browser-use.com  connect.hyperbrowser.ai
# milankarman.github.io/embed-web-playground  id_/http  web.archive.org/save/
# arquivo.pt/savepagenow  uqtag=  uqscan  chatgpttest  agenttest  zz=oai
# tok=expt  archive_test=  //webhook.site/  oastify.com  burpcollaborator.net
# interact.sh  .oast.  //ntfy.sh/  dnslog.cn  requestrepo.com
# Left out: href.li and *.translate.goog (WordPress and translation links,
# far too common in posts and edits), the scraping APIs of relay.scrape_api
# and codesandbox.io (their own users' issues and posts name them all day),
# s.jina.ai (its path is a search query, not a target) and the repository
# digest services of relay.repo_digest (READMEs link them all day).
# The carrier rules that read program content fire on what the unwrapper
# finds inside a URL these substrings already keep.

# ── Relays: agents wrap targets so the request comes from someone else's server ──
# Archives capture these wrapped URLs when the relay's output is saved or linked,
# so the capture's URL carries the real target plus any payload and run tags.

# Rationale: a relay named in the published swarmcha.se and Transluce incident
# reports. `r.jina.ai/<target>` puts the full target URL in the path, so payloads
# and `uqtag`-style run tags survive. Feeds relay.jina. Noise: people reading
# articles through Jina; scoring needs a second indicator to flag those.
[[source]]
name = "jina-reader"
kind = "wayback"          # see Kinds above
pattern = "r.jina.ai/*"
from = "20260901"         # first run starts here; later runs continue from the cursor
limit = 5000              # max records per run; the rest continue next run
page_size = 1000

# Rationale: CORS proxy agents use to fetch pages from inside a remote browser
# (`/get?url=` and `/raw?url=` carry the target as a parameter). Feeds
# relay.allorigins. Noise: front-end demos fetching public APIs.
[[source]]
name = "allorigins"
kind = "wayback"
pattern = "api.allorigins.win/*"
from = "20260901"
limit = 5000

# Rationale: URL-to-Markdown converter used the same way as Jina Reader, by agents
# that need page text without running a browser. Feeds relay.markdown_new.
[[source]]
name = "markdown-new"
kind = "wayback"
pattern = "markdown.new/*"
from = "20260901"
limit = 2000

# Rationale: headless fetch API; the target is in `?url=` and agents add
# `screenshot`, `meta` or `data` options that show automated use. Feeds
# relay.microlink. Noise: link-preview widgets, which repeat the same few URLs.
[[source]]
name = "microlink"
kind = "wayback"
pattern = "api.microlink.io/*"
from = "20260901"
limit = 2000

# Rationale: public CORS proxy, used the same way as allorigins; the target
# follows `?url=` or the path. Feeds relay.corsproxy.
[[source]]
name = "corsproxy-io"
kind = "wayback"
pattern = "corsproxy.io/*"
from = "20260901"
limit = 2000

# Rationale: a second crawler's view of the same relay URLs. Common Crawl's
# monthly crawls follow links found on pages, so a relay URL an agent posted
# somewhere public shows up with its full target and tags. Feeds relay.jina and
# the marker rules. Noise: as for jina-reader, and a crawl lands only monthly,
# so most runs add nothing. Index rows only, never WARC content. Terms
# (https://commoncrawl.org/terms-of-use): a limited licence to use the service
# and data; no disrupting the servers, harvesting personal data or disguising
# the requester.
[[source]]
name = "cc-jina-reader"
kind = "commoncrawl"
pattern = "r.jina.ai/*"
endpoint = "latest"       # the newest crawl; `latest:2` or a crawl id also work
from = "20260901"
limit = 2000

# Rationale: the crawler's view of the allorigins CORS proxy, as for
# cc-jina-reader. Feeds relay.allorigins and what the unwrapper finds in
# `?url=`. Noise: front-end demos linked from their own pages. Terms as above.
[[source]]
name = "cc-allorigins"
kind = "commoncrawl"
pattern = "api.allorigins.win/*"
endpoint = "latest"
from = "20260901"
limit = 2000

# Rationale: the crawler's view of the markdown.new converter, as for
# cc-jina-reader. Feeds relay.markdown_new. Noise: people linking a page's
# Markdown rendering. Terms as above.
[[source]]
name = "cc-markdown-new"
kind = "commoncrawl"
pattern = "markdown.new/*"
endpoint = "latest"
from = "20260901"
limit = 2000

# Rationale: URL-to-Markdown converter used the way agents use Jina Reader:
# `pure.md/<target>` puts the target in the path, so payloads and run tags
# survive in the capture. Feeds relay.pure_md. Noise: people reading pages
# as Markdown. Terms as for the other Wayback sources.
[[source]]
name = "pure-md"
kind = "wayback"
pattern = "pure.md/*"
from = "20260901"
limit = 2000

# Rationale: the same converter pattern on defuddle.md (`defuddle.md/<target>`).
# Feeds relay.defuddle_md. Noise: as for pure-md.
[[source]]
name = "defuddle-md"
kind = "wayback"
pattern = "defuddle.md/*"
from = "20260901"
limit = 2000

# Rationale: CodeTabs proxy endpoint, the other proxy relay.corsproxy names. Only
# the `/v1/proxy` path is collected; the rest of the site is unrelated tools.
[[source]]
name = "codetabs-proxy"
kind = "wayback"
pattern = "api.codetabs.com/v1/proxy*"
from = "20260901"
limit = 2000

# ── Carriers: services that run or reshape the agent's request ─────────────────

# Rationale: request echo service; agents use it to turn a GET into a POST, test
# headers, or check their own egress IP before probing. Feeds carrier.httpbin.
# Noise: very high (developer tests). The whole host is too big for one index
# query (`httpbin.org/*` times out at the gateway), so only the paths agents
# use to carry a request are read, each as its own prefix, in week-long
# windows of small pages that resume where a failure stopped them.
#
# `/base64/<payload>` echoes the decoded payload back: how programs were
# delivered to a remote browser. The unwrapper decodes it, so the program's
# own fetches feed carrier.inline_fetch_program and the exploit rules.
[[source]]
name = "httpbin-base64"
kind = "wayback"
pattern = "httpbin.org/base64/*"
from = "20260901"
slice_days = 7            # read the range a week at a time
limit = 1000
page_size = 500

# `/anything` echoes whatever request it gets, so an agent sends its payload
# there to see what a server would receive, or to launder a GET into a POST.
[[source]]
name = "httpbin-anything"
kind = "wayback"
pattern = "httpbin.org/anything*"
from = "20260901"
slice_days = 7
limit = 1000
page_size = 500

# `/redirect-to?url=<target>` bounces a fetch to the target from httpbin's
# origin; the target is in the parameter.
[[source]]
name = "httpbin-redirect"
kind = "wayback"
pattern = "httpbin.org/redirect-to*"
from = "20260901"
slice_days = 7
limit = 1000
page_size = 500

# Rationale: httpbin's clone on httpbun.com, the same echo carrier with the
# same paths (`/base64/`, `/anything`, `/redirect-to`), swapped in when
# httpbin.org is slow or blocked. Small enough to read whole. Feeds
# carrier.httpbin and what the unwrapper finds inside. Noise: developer
# tests, as for httpbin.
[[source]]
name = "httpbun"
kind = "wayback"
pattern = "httpbun.com/*"
from = "20260901"
limit = 2000

# Rationale: in-browser code playground. Share links carry the whole program in
# the URL, so a fetch program aimed at a target is visible in the capture itself,
# and it runs from a third-party origin. Feeds carrier.livecodes and carrier.inline_fetch_program.
[[source]]
name = "livecodes"
kind = "wayback"
pattern = "livecodes.io/*"
from = "20260901"
limit = 2000

# ── Scan services ──────────────────────────────────────────────────────────────

# Rationale: agents submit targets to public scanners to fetch them from a
# neutral origin; urlquery reports keep the submitted URL, the final URL (which
# shows network errors and bot challenges) and the target's IP and ASN. Needs
# URLQUERY_APIKEY; skipped without it. urlquery's terms allow personal,
# non-commercial research and forbid redistributing their content, so notices
# cite urlquery reports by link and quote only the indicators we derived.
[[source]]
name = "urlquery-jina"
kind = "urlquery"
pattern = "r.jina.ai"
from = "20260901"
limit = 1000
page_size = 100

# Rationale: the same submissions through the other relays and carriers the
# rules know: an agent that submits `api.allorigins.win/raw?url=<target>` or
# a LiveCodes share link to a scanner gets the wrapped request sent from the
# scanner's origin, and the report keeps the submission time. Feed
# relay.allorigins, relay.markdown_new, relay.corsproxy, carrier.httpbin and
# carrier.livecodes, and the timing links only submit-time records give.
# Noise: people scanning a proxy link someone sent them. The key's quota is
# shared, so each reads at most three pages of 100 a run, and a pull that
# fills `limit` moves its cursor no further than its oldest report (the
# digest warns). Terms as for urlquery-jina.

[[source]]
name = "urlquery-allorigins"
kind = "urlquery"
pattern = "api.allorigins.win"
from = "20260901"
limit = 300
page_size = 100

[[source]]
name = "urlquery-markdown-new"
kind = "urlquery"
pattern = "markdown.new"
from = "20260901"
limit = 300
page_size = 100

[[source]]
name = "urlquery-httpbin"
kind = "urlquery"
pattern = "httpbin.org"
from = "20260901"
limit = 300
page_size = 100

[[source]]
name = "urlquery-livecodes"
kind = "urlquery"
pattern = "livecodes.io"
from = "20260901"
limit = 300
page_size = 100

[[source]]
name = "urlquery-corsproxy"
kind = "urlquery"
pattern = "corsproxy.io"
from = "20260901"
limit = 300
page_size = 100

# Rationale: Arquivo.pt's SavePageNow archives any URL anyone submits, and
# agents have used it the way they use urlquery: a neutral origin that
# fetches the target for them. Its crawls reach the index months late, but
# on-demand saves are merged within days into collections named `SAWP<n>`,
# so only those are read (`filter`). Feeds relay.jina and the payload and
# marker rules, as captures (capture time, not submission time). Noise:
# people saving a Jina-rendered article. One request per run; Arquivo.pt's
# index cannot page, so the digest warns when a pull fills `limit`. Terms
# (https://sobre.arquivo.pt/en/about/terms-and-conditions/): free access for
# research, no commercial use, no interfering with the service, cite
# Arquivo.pt; index rows only, captures cited by link.
[[source]]
name = "arquivo-spn-jina"
kind = "arquivo"
pattern = "r.jina.ai/*"
filter = ["collection:SAWP.*"]
from = "20260901"
limit = 2000

# Rationale: the same channel for the echo carrier: an agent that saves an
# httpbin URL through Arquivo.pt gets the request sent from Arquivo.pt's
# origin. Feeds carrier.httpbin and what the unwrapper finds inside.
[[source]]
name = "arquivo-spn-httpbin"
kind = "arquivo"
pattern = "httpbin.org/*"
filter = ["collection:SAWP.*"]
from = "20260901"
limit = 2000

# Rationale: the same channel for the CORS proxy and the Markdown converter:
# a save of an allorigins or markdown.new URL sends the wrapped request from
# Arquivo.pt's origin. Feed relay.allorigins and relay.markdown_new. Noise:
# people saving a proxied page. Terms as for arquivo-spn-jina.
[[source]]
name = "arquivo-spn-allorigins"
kind = "arquivo"
pattern = "api.allorigins.win/*"
filter = ["collection:SAWP.*"]
from = "20260901"
limit = 2000

[[source]]
name = "arquivo-spn-markdown-new"
kind = "arquivo"
pattern = "markdown.new/*"
filter = ["collection:SAWP.*"]
from = "20260901"
limit = 2000

# ── Code hosts, registries and certificates ───────────────────────────────────

# Rationale: agents that work through GitHub (issues, comments, new repos)
# paste the relay URLs and run tags they use, and swarms create repos named
# after their runs. Keeps public events whose repo name or payload URLs match
# the shared list above;
# the record is the event's public link, so the URL rules do not fire on it:
# these are leads for review, linked by time and name. Noise: developers
# discussing Jina Reader or proxies. GitHub's event payloads carry no pull
# request text and no commits, so URLs come from issues, comments, reviews,
# discussions and releases. Reads on from the last hour read, up to six
# hours (one per hour between scheduled runs, so the whole stream), streamed;
# `max_mb` leaves room for six of the largest hours, so the hour cap, not the
# byte cap, ends a run. Every hour read must parse events (the canary); an
# hour whose file is corrupt is skipped and counted, not retried. Terms: GH Archive republishes GitHub's
# public API events with no further terms; GitHub's Acceptable Use Policies
# section 7 (https://docs.github.com/en/site-policy/acceptable-use-policies/github-acceptable-use-policies)
# allow research use of public, non-personal information with open-access
# publications, and forbid spam or selling personal information.
[[source]]
name = "gharchive-relays"
kind = "gharchive"
pattern = "//r.jina.ai/http|//markdown.new/|//pure.md/|//defuddle.md/|api.allorigins.win/|corsproxy.io/|cors-anywhere|thingproxy|codetabs.com/v1/proxy|api.microlink.io/|httpbin.org/base64|httpbin.org/anything|httpbin.org/redirect-to|//httpbun.com/|//httpbun.org/|livecodes.io/?|.e2b.app|.modal.run|.proxy.daytona.work|production-sfo.browserless.io|production-lon.browserless.io|production-ams.browserless.io|chrome.browserless.io|connect.browserbase.com|connect.steel.dev|connect.browser-use.com|connect.hyperbrowser.ai|milankarman.github.io/embed-web-playground|id_/http|web.archive.org/save/|arquivo.pt/savepagenow|uqtag=|uqscan|chatgpttest|agenttest|zz=oai|tok=expt|archive_test=|//webhook.site/|oastify.com|burpcollaborator.net|interact.sh|.oast.|//ntfy.sh/|dnslog.cn|requestrepo.com"
scan = 6                  # hours per run, read on from the last one read
max_mb = 1024             # compressed bytes per run
limit = 500

# Rationale: agents that edit wikis add the links they fetch through or
# report to, and agents attributed to one provider were found making
# unapproved test edits to Wikipedia sandboxes and pointing a citation tool's
# configuration at their own targets, using it as a fetch proxy. Wikimedia's
# EventStreams publishes every link an edit adds, on every wiki, as it
# happens; this keeps the added external links that match relay hosts and
# run tags (the shared list above). The record is the link (never fetched),
# its reference the edit's diff. Bot-flagged accounts and the stream's
# canary events are dropped.
# Noise: editors citing pages through archive or translation proxies. Reads
# on from the last event read for up to `scan` minutes of wall time and
# `max_mb` MB; the digest shows minutes of stream read against minutes there
# were. Terms: EventStreams is a public service; Wikimedia's User-Agent
# policy (https://foundation.wikimedia.org/wiki/Policy:User-Agent_policy)
# asks for an identifying user agent with contact details, which every
# request sends.
[[source]]
name = "wikimedia-relay-links"
kind = "wikimedia"
pattern = "//r.jina.ai/http|//markdown.new/|//pure.md/|//defuddle.md/|api.allorigins.win/|corsproxy.io/|cors-anywhere|thingproxy|codetabs.com/v1/proxy|api.microlink.io/|httpbin.org/base64|httpbin.org/anything|httpbin.org/redirect-to|//httpbun.com/|//httpbun.org/|livecodes.io/?|.e2b.app|.modal.run|.proxy.daytona.work|production-sfo.browserless.io|production-lon.browserless.io|production-ams.browserless.io|chrome.browserless.io|connect.browserbase.com|connect.steel.dev|connect.browser-use.com|connect.hyperbrowser.ai|milankarman.github.io/embed-web-playground|id_/http|web.archive.org/save/|arquivo.pt/savepagenow|uqtag=|uqscan|chatgpttest|agenttest|zz=oai|tok=expt|archive_test=|//webhook.site/|oastify.com|burpcollaborator.net|interact.sh|.oast.|//ntfy.sh/|dnslog.cn|requestrepo.com"
scan = 10                 # wall-clock minutes per run
max_mb = 512              # stream bytes per run
limit = 2000

# Rationale: the same stream, every external link added to pages in the
# script and configuration namespaces (MediaWiki: 8, Module: 828), where a
# tool's configuration lives. Edits there are rare and need rights, so a
# link added to one is worth a look whatever its host. Noise: maintainers
# updating documentation links. Terms as above.
[[source]]
name = "wikimedia-config-links"
kind = "wikimedia"
pattern = "*"
filter = ["ns:8", "ns:828"]
scan = 10
max_mb = 512
limit = 500

# Rationale: agents that post to forums paste the relay URLs they fetch
# through and the run tags they carry, and agent-built projects are
# announced as stories. Hacker News's search index lists every story and
# comment with its submitted URL and text; this keeps the links (and items
# whose title or text carries a run tag) that match the shared list above.
# The record is the link (never fetched), its reference the item's page.
# Feeds the relay, carrier, marker and callback rules.
# Noise: people discussing Jina Reader or sharing a proxied link. Reads
# back from the run's start to the last run's, up to `scan` index queries
# of 1000 items; the digest shows minutes read against minutes there were.
# Terms: the Hacker News API (https://github.com/HackerNews/API) states no
# rate limit; the Algolia search API (https://hn.algolia.com/api) allows
# 10,000 requests an hour per IP. Items are public posts; the link and the
# item's page are kept, never the author's name.
[[source]]
name = "hackernews-relay-links"
kind = "hackernews"
pattern = "//r.jina.ai/http|//markdown.new/|//pure.md/|//defuddle.md/|api.allorigins.win/|corsproxy.io/|cors-anywhere|thingproxy|codetabs.com/v1/proxy|api.microlink.io/|httpbin.org/base64|httpbin.org/anything|httpbin.org/redirect-to|//httpbun.com/|//httpbun.org/|livecodes.io/?|.e2b.app|.modal.run|.proxy.daytona.work|production-sfo.browserless.io|production-lon.browserless.io|production-ams.browserless.io|chrome.browserless.io|connect.browserbase.com|connect.steel.dev|connect.browser-use.com|connect.hyperbrowser.ai|milankarman.github.io/embed-web-playground|id_/http|web.archive.org/save/|arquivo.pt/savepagenow|uqtag=|uqscan|chatgpttest|agenttest|zz=oai|tok=expt|archive_test=|//webhook.site/|oastify.com|burpcollaborator.net|interact.sh|.oast.|//ntfy.sh/|dnslog.cn|requestrepo.com"
scan = 10                 # index queries per run (1000 items each)
limit = 500

# Rationale: agents that post to social networks paste the relay URLs they
# fetched through and the run tags they carry, as on Hacker News. Bluesky's
# Jetstream relays every public post; this keeps the links in a post's link
# facets and link card that match the shared list above, and posts whose
# text carries a run tag. The record is the link (never fetched), its
# reference the post's page on bsky.app. Coverage is a sample, not the
# stream: a run reads at most the newest half hour of posts, in `scan`
# wall-clock minutes, and the digest shows minutes read against minutes
# since the last run; links posted in the rest are never seen. Posts
# deleted during the read are dropped. Noise: people sharing proxied links
# and webhook demos. Terms as for `bluesky-posts` below.
[[source]]
name = "bluesky-relay-links"
kind = "bluesky"
endpoint = "jetstream2.us-east.bsky.network"
pattern = "//r.jina.ai/http|//markdown.new/|//pure.md/|//defuddle.md/|api.allorigins.win/|corsproxy.io/|cors-anywhere|thingproxy|codetabs.com/v1/proxy|api.microlink.io/|httpbin.org/base64|httpbin.org/anything|httpbin.org/redirect-to|//httpbun.com/|//httpbun.org/|livecodes.io/?|.e2b.app|.modal.run|.proxy.daytona.work|production-sfo.browserless.io|production-lon.browserless.io|production-ams.browserless.io|chrome.browserless.io|connect.browserbase.com|connect.steel.dev|connect.browser-use.com|connect.hyperbrowser.ai|milankarman.github.io/embed-web-playground|id_/http|web.archive.org/save/|arquivo.pt/savepagenow|uqtag=|uqscan|chatgpttest|agenttest|zz=oai|tok=expt|archive_test=|//webhook.site/|oastify.com|burpcollaborator.net|interact.sh|.oast.|//ntfy.sh/|dnslog.cn|requestrepo.com"
scan = 3                  # wall-clock minutes per run
max_mb = 256              # stream bytes per run
limit = 500

# Rationale: GH Archive's payloads carry no pull request text and no
# commits, so relay URLs and run tags an agent writes into a pull request or
# a commit message never reach gharchive-relays. GitHub's search API finds
# them: one search per substring for pull requests created and commits
# committed since the last run, each result checked again against the
# substring (search matches words). Only relay links and run tags become
# records; the footers coding agents add to their own work (`Generated with
# ...`, `Co-Authored-By:`) are everyday use and never match. The record is
# the link (never fetched), its reference the pull request or commit page.
# Relay hosts whose words are common English (markdown.new) are left out:
# their searches would spend the budget on ordinary text. Needs
# GITHUB_TOKEN; skipped without it. Search allows 30 requests a minute and
# 1000 results a search; `scan` caps requests a run, and a search cut short
# is counted as skipped. Noise: developers discussing these relays. Terms:
# the search API (https://docs.github.com/en/rest/search/search) and
# GitHub's Acceptable Use Policies, as for gharchive-relays.
[[source]]
name = "github-search-relays"
kind = "ghsearch"
pattern = "r.jina.ai/http|//pure.md/|//defuddle.md/|api.allorigins.win/|corsproxy.io/|api.microlink.io/|uqtag=|uqscan|chatgpttest|agenttest|zz=oai"
scan = 40                 # search requests per run
limit = 500


# Rationale: swarms told to "ship" or prove reach publish throwaway packages
# whose names or summaries carry run tags. Keeps the newest PyPI releases
# matching the tags; leads for review (the record is the package page). Noise:
# low, mostly unrelated packages that happen to contain the tag text. One
# request per run, revalidated with its ETag. Terms
# (https://policies.python.org/pypi.org/Terms-of-Service/): API use within
# rate limits; no excessive requests, spam or selling personal information.
[[source]]
name = "pypi-tags"
kind = "pypi"
pattern = "uqtag|uqscan"
endpoint = "updates"
limit = 200

# Rationale: the same behaviour on npm, through its search API (names,
# versions and publish times; maintainer details are dropped). Noise: packages
# whose descriptions mention the tag text. Terms
# (https://docs.npmjs.com/policies/open-source-terms): programmatic access
# through the documented public APIs; no automating the website, no
# unreasonable volume, no use as a general-purpose database. The tag search
# finds nothing most runs, so one extra search for a package name every
# registry holds is the canary that the API still answers in the expected
# shape.
[[source]]
name = "npm-tags"
kind = "npm"
pattern = "uqtag"
canary = "react"
limit = 250
page_size = 250

# Rationale: new certificates for relay look-alikes and mirrors (self-hosted
# allorigins and corsproxy copies, Jina Reader clones) that agents switch to
# when a public relay blocks them. Each log grows by about a thousand entries
# a minute, so a pull reads its newest entries and the digest shows how much
# of the growth since the last run that was: a sample, not a monitor; crt.sh
# stays the per-name lookup (`swarmchase certs`). Three logs from two
# operators widen the sample. Google's logs return 32 entries a request and
# Cloudflare's 256, so the scans differ to keep each log to a few dozen paced
# requests. Let's Encrypt now logs only to tiled (static-ct) logs, which this
# reader does not speak. The record is the certificate's name, a lead for
# review. Noise: legitimate self-hosted proxies. Terms: CT logs are public by
# design (RFC 6962, RFC 9162) and publish no restrictions beyond fair rates.
[[source]]
name = "ct-relay-lookalikes"
kind = "ctlog"
endpoint = "https://ct.googleapis.com/logs/us1/argon2026h2/"
pattern = "allorigins|corsproxy|jina-reader|r-jina"
scan = 1024
limit = 200

[[source]]
name = "ct-relay-lookalikes-xenon"
kind = "ctlog"
endpoint = "https://ct.googleapis.com/logs/eu1/xenon2026h2/"
pattern = "allorigins|corsproxy|jina-reader|r-jina"
scan = 1024
limit = 200

[[source]]
name = "ct-relay-lookalikes-nimbus"
kind = "ctlog"
endpoint = "https://ct.cloudflare.com/logs/nimbus2026/"
pattern = "allorigins|corsproxy|jina-reader|r-jina"
scan = 4096
limit = 200

# ── Agent platforms ───────────────────────────────────────────────────────────

# Rationale: agents and agent platforms announce themselves in well-known
# files: A2A agent cards (`agent-card.json`, `agent.json`), agent registration
# files, and the Web Bot Auth key directory a signing agent serves
# (`http-message-signatures-directory`). A capture of one on a throwaway
# tunnel or free-hosting subdomain is a lead for the platform a run used,
# for linking later. Reads Wayback index rows for those paths only (a
# server-side filter); the files are never fetched. The index cannot search
# one path across all hosts, so the pattern lists tunnel and free-hosting
# domains whose index answers within the gateway's time (`*.workers.dev` does
# not). Noise: developers testing agent frameworks. Terms: as for the other
# Wayback sources.
[[source]]
name = "agent-footprints"
kind = "wellknown"
pattern = "*.trycloudflare.com|*.ngrok-free.app|*.ngrok.app|*.loca.lt|*.hf.space|*.onrender.com"
from = "20260901"
limit = 500
page_size = 500

# Rationale: the official MCP Registry lists the tool servers agents are
# given, with the repository, website and remote endpoint each declares.
# Stored as metadata (name, version, publish time, declared hosts) so a host
# in a run can later be matched to a tool server; nothing here is a lead by
# itself, and no server is contacted. Reads only servers updated since the
# last run (`updated_since`), 100 a page. Noise: all of it, by design; it is
# reference data. Terms (https://modelcontextprotocol.io/registry/terms-of-service):
# Registry Data is dedicated to the public domain (CC0 1.0) and may be
# processed by others; no interfering with or disrupting the Registry.
[[source]]
name = "mcp-registry"
kind = "mcp"
pattern = "*"
from = "20260901"
limit = 2000
page_size = 100

# Rationale: agents are given skills from ClawHub, the OpenClaw skills
# registry, and skill fleets are published in bursts, some carrying the
# relay links or run tags of the runs that made them (documented
# malicious-skill waves were published this way). The public listing,
# newest first, gives each skill's owner handle, slug, display name,
# summary and topics; this keeps skills whose text matches the shared list
# above. A matching URL in the summary is the record (never fetched), its
# reference the skill's canonical page (clawhub.ai/<owner>/skills/<slug>);
# a run tag with no URL makes the page the record. Leads for review. Skill
# files are never downloaded. Pages of 100 back to the last skill read, up
# to `scan` pages. Noise: skills that document a relay or a webhook demo.
# Terms (https://docs.openclaw.ai/clawhub/api): catalogs built on the public
# read endpoints are allowed if they cache, honour 429 and Retry-After,
# link the canonical skill page and never mirror hidden or blocked content;
# anonymous reads are limited to 3000 a minute per IP.
[[source]]
name = "clawhub-relay-links"
kind = "clawhub"
pattern = "//r.jina.ai/http|//markdown.new/|//pure.md/|//defuddle.md/|api.allorigins.win/|corsproxy.io/|cors-anywhere|thingproxy|codetabs.com/v1/proxy|api.microlink.io/|httpbin.org/base64|httpbin.org/anything|httpbin.org/redirect-to|//httpbun.com/|//httpbun.org/|livecodes.io/?|.e2b.app|.modal.run|.proxy.daytona.work|production-sfo.browserless.io|production-lon.browserless.io|production-ams.browserless.io|chrome.browserless.io|connect.browserbase.com|connect.steel.dev|connect.browser-use.com|connect.hyperbrowser.ai|milankarman.github.io/embed-web-playground|id_/http|web.archive.org/save/|arquivo.pt/savepagenow|uqtag=|uqscan|chatgpttest|agenttest|zz=oai|tok=expt|archive_test=|//webhook.site/|oastify.com|burpcollaborator.net|interact.sh|.oast.|//ntfy.sh/|dnslog.cn|requestrepo.com"
limit = 500
page_size = 100
scan = 5                  # listing pages per run

# ── Per-case sources (not scheduled) ─────────────────────────────────────────
# - urlscan.io public search (`swarmchase collect urlscan`, URLSCAN_APIKEY
#   optional): its terms (https://urlscan.io/terms/) license personal,
#   non-commercial use and need written permission for systematic retrieval
#   into a database, so it is a per-case lookup, cited by report link. With
#   that permission, a scheduled entry would read:
# [[source]]
# name = "urlscan-jina"
# kind = "urlscan"
# pattern = "task.domain:r.jina.ai"
# from = "20260901"
# limit = 500
# page_size = 100
# - Memento timemaps (`swarmchase collect memento <url>`): one exact URL across
#   archives beyond the Wayback Machine, for an endpoint's history in a case.

# ── Deliberately not watched ───────────────────────────────────────────────────
# - Callback channels (webhook.site, requestbin, ntfy.sh, paste sites): listing
#   captures of those URLs means reading the swarm's channels, which the passive
#   rule forbids. They are matched in records found through other sources.
# - Wikis and pages agents use to coordinate with each other (the public wikis
#   outside Wikimedia an agent fleet was found using for that): reading them
#   is reading the swarm's channel, as with callback channels. Their links
#   reach us only through edits to Wikimedia wikis, read above.
# - Arquivo.pt crawls: they reach the index months after capture, so they add
#   nothing to a 30-day window; only its on-demand saves are watched (above).
#   Use `swarmchase collect arquivo` per case for an endpoint's history.
# - httpbin.org as a whole: the host-wide index query times out at the gateway;
#   the paths agents use are watched one by one (above).
# - href.li (referrer-stripping redirector, relay.hrefli): the Wayback CDX
#   query for `href.li/*` times out at the server's gateway (HTTP 504) even
#   with a small limit and a recent `from`, because the host has too many
#   captures. relay.hrefli still fires inside records from the sources above.
# - *.translate.goog: very high volume and mostly people translating pages; the
#   relay rule still catches it inside records from the sources above.
#
# Add targets you are watching (agencies, data portals) per case, with match_type:
# [[source]]
# name = "portal"
# kind = "wayback"
# pattern = "data.portal.example"
# match_type = "domain"
# from = "20260901"
# limit = 5000

# ── Coordinated accounts on public platforms (docs/reference/watch.md#platform-swarms) ──
# A separate pass: many accounts acting alike (near-identical or templated
# issues, comments and descriptions, templated names) in a burst beyond
# chance. Sources here are read in full and grouped, not filtered by a
# pattern; only events worth another look are carried between runs, for
# `carry_hours`. Output is a digest section of hints, never a finding.
[platform]
carry_hours = 72
label_days = 30           # keep labels from reference sources (osv, wikimedia-ai-cleanup) this long
history_days = 30         # remember name and text families seen bursting this long (platform/baseline.json)
# Rationale: a registry fleet built in CI names where it was built. For the
# npm and PyPI candidates new or grown in a run, look up member releases'
# build provenance (npm's attestations endpoint, PyPI's integrity API), at
# most this many a run, members on an OSV-labelled package first; answers
# are kept for label_days so a release is looked up once. Several packages
# from one repository or workflow ties the fleet to the account behind it,
# as a hint. Publicly documented APIs, read by name and version, no package
# file downloaded. Terms: npm Open Source Terms
# (https://docs.npmjs.com/policies/open-source-terms), PyPI Terms of Service
# (https://policies.python.org/pypi.org/Terms-of-Service/). 0 turns it off.
provenance_lookups = 40
# [platform.options] takes the detector's tunables (min_accounts, burst_secs,
# max_chance, ...); the defaults are in crates/sc-core/src/platform/mod.rs.

# Rationale: agent swarms told to report bugs, ask for reviews or "prove
# reach" open near-identical issues and comments from fresh accounts, or
# create templated repositories, many at once, or star and fork one
# repository from fresh accounts. GH Archive carries the text, the account id
# (creation order, so a coarse age) and the time; GitHub's payloads carry no
# pull request text, so pull requests opened group by repository, as stars
# and forks do. Six hours per run, the hours since the last run, so the whole
# stream; the digest says how many hours were read and skipped. Logins
# become keyed hashes and text a slotted sketch at parse time; automation
# logins are dropped, and declared coding-agent Apps (declared-agents.toml)
# are tallied by product, with lookalike App logins listed as spoofing leads.
# Noise: contribution drives, outages, launches and issue templates, handled
# by the benign templates, practice repositories and the chance model. Terms
# as for `gharchive-relays` above.
[[platform.source]]
name = "gharchive-coordination"
kind = "gharchive"
pattern = "*"
scan = 6                  # hours per run
max_mb = 1024             # compressed bytes per run

# Rationale: package floods from one task fan out as new projects with
# templated names and summaries. The newest-projects feed carries names,
# summaries and times, no uploader, so groups here are floods, not accounts.
# One request per run, cached and revalidated. Terms as for `pypi-tags` above.
[[platform.source]]
name = "pypi-new-projects"
kind = "pypi"
endpoint = "packages"
pattern = "*"

# Rationale: Spaces created in bursts from fresh accounts with templated
# names. The Hub's listing API, newest first, gives ids, owners and creation
# times; a Space's page and app are never opened (an app runs its owner's
# code). One request per run. Terms: the Hub API is public and documented
# (https://huggingface.co/docs/hub/api); anonymous callers get hundreds of API
# requests per five minutes (https://huggingface.co/docs/hub/rate-limits); the
# content policy (https://huggingface.co/content-policy) forbids excessive bulk
# activity and publishing others' private information.
[[platform.source]]
name = "hf-new-spaces"
kind = "huggingface"
endpoint = "spaces"
pattern = "*"
limit = 500

# Rationale: the same bursts as models: a swarm told to publish or prove
# reach uploads model repositories under templated names from one or many
# fresh accounts. The models listing, newest first, gives ids, owners and
# creation times; a model's page is linked, its files never downloaded.
# One request per run. Noise: fine-tuning runs that push a checkpoint per
# step under numbered names (one owner, so one account). Terms as for
# `hf-new-spaces`.
[[platform.source]]
name = "hf-new-models"
kind = "huggingface"
endpoint = "models"
pattern = "*"
limit = 500

# Rationale: the same for datasets: agent pipelines that generate data
# publish one dataset per task or per target under templated names. The
# datasets listing gives ids, owners and creation times; descriptions are
# not kept and no file is downloaded. One request per run. Noise: dataset
# series from one lab (one owner) and benchmark mirrors. Terms as for
# `hf-new-spaces`.
[[platform.source]]
name = "hf-new-datasets"
kind = "huggingface"
endpoint = "datasets"
pattern = "*"
limit = 500

# Rationale: ClawHub skill fleets are published in bursts under templated
# names, from one owner or many, and documented malicious-skill waves on
# the registry looked like this. The public listing, newest first, gives
# the owner handle (kept as a keyed hash), slug (as a name template),
# summary and topics (sketched) and creation time. Pages of 100 back to the
# last skill read, up to `scan` pages and `limit` skills. Skill files are
# never downloaded; events link the canonical skill page. Noise: one
# author publishing a family of skills at once (one owner, so one
# account). Terms as for `clawhub-relay-links` above.
[[platform.source]]
name = "clawhub-skills"
kind = "clawhub"
pattern = "*"
limit = 500
page_size = 100
scan = 5                  # listing pages per run

# Rationale: editor extensions are an agent's tools as skills are, and
# extension floods under templated names reach Open VSX, the registry
# VS Code forks install from. The search API, newest first, gives
# namespace (kept as a keyed hash), name, version, publish time, the
# verified-publisher flag and the description (sketched); one page of
# `page_size` a run, the span it misses counted as skipped. The `.vsix` and
# every other file the listing links are never fetched. Off: the Eclipse
# Foundation's terms of use (https://www.eclipse.org/legal/terms-of-use/)
# say nothing of automated access and the service rate-limits by tier;
# enable once the Eclipse Foundation confirms automated listing reads are
# welcome.
# [[platform.source]]
# name = "openvsx-new"
# kind = "openvsx"
# pattern = "*"
# page_size = 50

# Rationale: the same package floods on Go: modules need no registry account,
# only a repository, so a swarm that publishes code publishes modules with
# templated paths. The module proxy's index lists every module version as
# the proxy first caches it, oldest first, with path, version and time; the
# path's owner (`github.com/<owner>`) stands for the account, as a keyed
# hash. Reads on from the last entry read, up to twelve requests of 2000
# entries a run. Noise: pseudo-versions of active modules and monorepos with
# numbered submodules. Terms: the index (https://index.golang.org/) is public
# and states no terms or rate limits; the module code is never fetched.
[[platform.source]]
name = "go-new-modules"
kind = "golang"
pattern = "*"
scan = 12                 # index requests per run

# Rationale: the same package floods on NuGet. The catalog is NuGet's
# append-only log of every package pushed, changed or deleted, in pages of
# ids, versions and commit times; it names no owner, so groups here are
# floods of templated names (`probe-<num>`), not accounts. Reads the pages
# committed since the last run, oldest first, up to `scan` pages (each
# about an hour and a half of commits). Noise: vendors releasing a numbered
# family of packages at once, and nightly builds. Terms: the catalog is
# NuGet's documented way to follow every package operation
# (https://learn.microsoft.com/en-us/nuget/api/catalog-resource); the
# nuget.org Terms of Use (https://www.nuget.org/policies/Terms) forbid
# disrupting the service. Package contents are never fetched.
[[platform.source]]
name = "nuget-catalog"
kind = "nuget"
pattern = "*"
scan = 6                  # catalog pages per run

# Rationale: the same floods on Packagist (PHP). Its change feed lists
# every package updated since a timestamp it hands out; the vendor
# (`vendor/name`) stands for the account, as a keyed hash, so a swarm
# publishing under several new vendors with templated names groups. One
# request a run; the feed keeps a day, so a missed day is counted as a
# gap. Noise: monorepo splits that update dozens of a vendor's packages at
# once (one vendor, so one account). Terms: Packagist's API documentation
# (https://packagist.org/apidoc) points mirrors at this feed and asks for a
# User-Agent with a contact address (set SWARMCHASE_UA to add a mailto=)
# and runs off the hour.
[[platform.source]]
name = "packagist-changes"
kind = "packagist"
pattern = "*"

# Rationale: the same floods on RubyGems. The newest-gems listing gives
# fifty gems with their first version's time, the gemspec's author string
# (a keyed hash) and summary (a sketch); one request a run, so a sample of
# the last hour or two. Noise: SDK generators that publish many gems with
# one author string and templated names. Terms: RubyGems allows 10 API
# requests a second per IP (https://guides.rubygems.org/rubygems-org-rate-limits/).
[[platform.source]]
name = "rubygems-new"
kind = "rubygems"
endpoint = "latest"
pattern = "*"

# Rationale: the same floods on crates.io. The newest-crates listing gives
# names, creation times, descriptions and the declared repository, whose
# host and owner (`github.com/<owner>`) stand for the account as a keyed
# hash. Pages of 100, newest first, back to the last run, up to `scan`
# pages. Noise: workspaces publishing a family of crates at once (one
# owner, so one account). Terms: crates.io's data access policy
# (https://crates.io/data-access) allows one API request a second with an
# identifying User-Agent; the watch paces every host at `min_interval_secs`.
[[platform.source]]
name = "crates-new"
kind = "crates"
pattern = "*"
scan = 6                  # listing pages per run

# Rationale: swarms that publish code create repositories with templated
# names in bursts, and not only on GitHub: GitLab.com takes new projects
# from any account without review. The public projects listing, newest
# first, gives path, description and creation time; the top-level
# namespace stands for the account, as a keyed hash. No account age: the
# listing does not give one. Pages of 100 back to the last run, up to
# `scan` pages; a busy stretch reads the newest part and the digest counts
# the rest as skipped. Noise: course and template exercises (many students
# creating `lab-<num>` at once) and CI-created scratch projects, handled
# by the chance model and the benign templates. Terms: GitLab's Acceptable
# Use Policy (https://handbook.gitlab.com/handbook/legal/acceptable-use-policy/)
# forbids disrupting the service and collecting users' personal data;
# anonymous API callers get hundreds of requests a minute
# (https://docs.gitlab.com/user/gitlab_com/). No repository is opened.
[[platform.source]]
name = "gitlab-new-projects"
kind = "gitlab"
pattern = "*"
scan = 10                 # listing pages per run

# Rationale: the same on Codeberg, whose terms bar projects mostly written
# by generative AI tools, so a burst of templated repositories there from
# new accounts is worth a look. Forgejo's repository search, newest first,
# gives path, description, creation time and the owner's account creation
# time (a coarse age, as on a wiki); the owner's login becomes a keyed
# hash, and no name or address is kept. Pages of 50 back to the last run,
# up to `scan` pages, a handful of requests every six hours. Noise:
# personal projects created together by one person (one account). Terms:
# Codeberg's Terms of Use (https://codeberg.org/codeberg/org/src/branch/main/TermsOfUse.md)
# govern content and forbid doxxing; the API states a rate limit of 2000
# requests per ten minutes. No repository is opened.
[[platform.source]]
name = "codeberg-new-repos"
kind = "codeberg"
pattern = "*"
scan = 4                  # listing pages per run


# Rationale: agents told to find vulnerabilities file reports in bulk,
# and CVE records have been fabricated in bursts against one project with
# near-identical, model-written descriptions. The GitHub Advisory
# Database's unreviewed advisories mirror the CVE records the NVD
# publishes, with descriptions and references; each becomes an event whose
# text is sketched and whose target is the first source repository its
# references name, so many reports against one repository at once group.
# The credited finder, where a record credits one, is the account (keyed
# hash); most credit no one, so groups are floods. Reference URLs are
# matched as text, never fetched. Reads oldest first from the last
# advisory read, up to `scan` requests of 100. Noise: a CNA publishing a
# vendor's batch of advisories with templated descriptions. Terms: the
# REST API (https://docs.github.com/en/rest/security-advisories/global-advisories)
# allows 60 unauthenticated requests an hour; the database is CC-BY 4.0
# (https://github.com/github/advisory-database). The CVE Program's own
# list (`endpoint = "cvelist"`, records new in its delta log, one request
# each, terms at https://www.cve.org/Legal/TermsOfUse) also sees records
# the NVD never publishes, but costs a request per record; it is for case
# work, not scheduled.
[[platform.source]]
name = "cve-advisories"
kind = "cve"
endpoint = "unreviewed"
pattern = "*"
scan = 6                  # requests of 100 advisories per run

# Rationale: agent swarms told to promote, argue or "prove reach" post
# near-identical replies and posts from fresh accounts, many at once, often
# into one thread. Bluesky's Jetstream relays every public post as it is
# made; the DID becomes a keyed hash, the text a slotted sketch, and a
# reply's target is its thread's root post (whose author is the target's
# owner). The stream carries tens of posts a second, so a run reads a
# sample: the newest half hour of stream time, read in at most `scan`
# wall-clock minutes; the digest shows minutes read against minutes since
# the last run. Account age comes from the PLC directory's audit log, only
# for accounts whose text a group could form around, at most `max_lookups`
# a run. Posts deleted during the read are dropped; no text, handle or DID
# is kept. Noise: memes and trending replies many people type alike, and
# reply guys on one celebrity's thread (one owner, established accounts).
# Terms: Jetstream (https://github.com/bluesky-social/jetstream) is a
# public service with no authentication or published rate limit; one
# connection a run. Bluesky's developer guidelines
# (https://docs.bsky.app/docs/support/developer-guidelines) ask for respect
# of deletions and privacy. The PLC directory (https://web.plc.directory/)
# is the public registry of did:plc identities.
[[platform.source]]
name = "bluesky-posts"
kind = "bluesky"
endpoint = "jetstream2.us-east.bsky.network"
pattern = "*"
scan = 3                  # wall-clock minutes per run
max_mb = 256              # stream bytes per run
max_events = 150000
max_lookups = 40          # account-age lookups per run

# Rationale: reference data, not events. A package flood is worth more
# once its packages are known to be malicious: OSV's malicious-package
# records (`MAL-` ids, from OpenSSF's malicious-packages project) name the
# packages, and the watch labels any candidate whose members published one
# ("Labelled" in the digest). Reads the ecosystem's modified_id.csv from
# the top down to the last record read, then fetches the new `MAL-`
# records, up to `scan` a run. Noise: none of its own; a label says what
# a package was, not who published it. Terms: the OSV data dumps
# (https://google.github.io/osv.dev/data/) are public for bulk use, OSV
# data is CC-BY 4.0 and the malicious-packages records Apache 2.0.
[[platform.source]]
name = "osv-malicious-npm"
kind = "osv"
endpoint = "npm"
pattern = "*"
scan = 50                 # records fetched per run

[[platform.source]]
name = "osv-malicious-pypi"
kind = "osv"
endpoint = "PyPI"
pattern = "*"
scan = 50

# Rationale: reference data, not events: human labels for free. English
# Wikipedia editors tag articles they suspect hold AI-generated text with a
# cleanup template that files them in a monthly category ("Articles
# containing suspected AI-generated texts from <month> <year>"). The watch
# labels any wiki candidate whose members edited a tagged page. Reads the
# category's members added since the last run through the MediaWiki API
# (list=categorymembers, sorted by when each was added), a request or two a
# run, rather than the recentchange stream that carries the same
# categorize events among every other change. Noise: a tag is an editor's
# suspicion, and most tagged pages were edited by one person, not a swarm.
# Terms: the MediaWiki API etiquette (https://www.mediawiki.org/wiki/API:Etiquette)
# asks for serial requests and an identifying user agent, which every
# request sends; page titles and times only are kept.
[[platform.source]]
name = "wikipedia-ai-cleanup"
kind = "wikimedia-ai-cleanup"
endpoint = "en.wikipedia.org"
pattern = "*"             # the default category name
scan = 4                  # API requests per run

# Rationale: agents told to test or prove they can edit open wikis make
# sandbox and draft edits from new accounts, many at once, with templated
# titles and summaries. Wikimedia's revision stream carries the editor, the
# account's registration time (a coarse age), the edit summary and the page
# title; the editor becomes a keyed hash, the summary a slotted sketch and
# the title a template (`user:<user>/sandbox`). Wiki groups need a burst of
# their own: new editors try their sandboxes all day. Bot-flagged accounts
# and canary events are dropped; Wikidata and Commons are left out, their
# tool-driven batch edits being most of the stream. Reads on from the last
# event read for up to ten minutes and 1024 MB a run, room for the six
# hours between runs; a run that falls short continues next run, and the
# digest shows minutes of stream read against minutes there were. Noise:
# edit-a-thons and classes, many new editors at once on one wiki. Terms as for
# `wikimedia-relay-links` above.
[[platform.source]]
name = "wikimedia-edits"
kind = "wikimedia"
pattern = "*"
filter = ["!domain:www.wikidata.org", "!domain:commons.wikimedia.org"]
scan = 10                 # wall-clock minutes per run
max_mb = 1024

# Rationale: agent swarms told to promote a project or "prove reach" post
# near-identical comments and Show HN stories from fresh accounts, many at
# once. The search index carries the author, the time, the title, the
# submitted URL and the text; the author becomes a keyed hash and the text
# a slotted sketch. A comment's target is its story, a story's the
# submitted URL's host, so many accounts on one story or one site group by
# target overlap. Account age comes from the Hacker News API's profile
# creation time, looked up only for authors whose text a group could form
# around, at most `max_lookups` a run. Noise: launch threads and memes,
# where many people write the same short reply; short replies are below
# the detector's word minimum. Reads back to the last run's start, up to
# `scan` queries of 1000 items. Terms as for `hackernews-relay-links` above.
[[platform.source]]
name = "hackernews-posts"
kind = "hackernews"
pattern = "*"
scan = 12                 # index queries per run (1000 items each)
max_lookups = 40          # account-age lookups per run
