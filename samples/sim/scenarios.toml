# Scenarios for `swarmchase sim bench` (crates/sc-sim). Synthetic: request
# content is copied from samples/eval and only who sends it, when and in what
# order is simulated. Each scenario runs under `seeds` seeds and is measured
# on its own; the background actors are the hard negatives. `expect` names
# the kinds a scenario is built to produce, with bounds set at or just below
# what it measures; they only go up.

# Every scenario holds these unless its own `expect` sets the key: no
# person's record in a cluster graded L3 or above, and no benign or tool
# record graded L2 or above. Scenarios with people pasting payloads or
# planting records set their own ceilings.
[defaults]
expect.human_high = { max_records = 0 }
expect.benign_high = { max_records = 0 }

# Soft-link kinds the bundled rules give a ratio above 1 that no scenario
# measures, each with the reason. `sim calibrate --check` fails on any other.
[calibration.unmeasured]
preamble = "the generator copies records one by one and writes no run's opening sequence of paths"
cut_length = "generated requests are never cut at a model's output length"
header_set = "generated records carry no request headers"
common_feature = "every generated run gets identifiers of its own, so none is common to many clusters"

