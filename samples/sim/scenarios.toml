# Scenarios for `swarmchase sim bench` (crates/sc-sim). Synthetic: request
# content is copied from samples/eval and only who sends it, when and in what
# order is simulated. Each scenario runs under `seeds` seeds and is measured
# on its own; the background actors are the hard negatives. `expect` names
# the kinds a scenario is built to produce, with bounds set at or just below
# what it measures; they only go up.

[[scenario]]
name = "sink"
seed = 11
seeds = 4
expect.S1 = { min_precision = 1.0, min_recall = 0.91 }
[[scenario.actor]]
kind = "swarm"
agents = 3
modes = ["sink"]
records = 8
[[scenario.actor]]
kind = "agent"
agents = 4
retry = 0.2
[[scenario.actor]]
kind = "relay_readers"
agents = 12
records = 3

