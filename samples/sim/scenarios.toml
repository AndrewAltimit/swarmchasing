# Scenarios for `swarmchase sim bench` (crates/sc-sim). Synthetic: request
# content is copied from samples/eval and only who sends it, when and in what
# order is simulated. Each scenario runs under `seeds` seeds and is measured
# on its own; the background actors are the hard negatives.

[[scenario]]
name = "sink"
seed = 11
seeds = 4
[[scenario.actor]]
kind = "swarm"
agents = 3
modes = ["sink"]
records = 8
[[scenario.actor]]
