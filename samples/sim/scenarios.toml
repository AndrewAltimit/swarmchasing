# Two scaffold fleets and one agent of another operator sending both
# fleets' shapes: a hub that chains them if components are taken whole.
# Among many other agents, so a shared shape can be rare (see fleet-crowd).
[[scenario]]
name = "hub-two-fleets"
seed = 251
seeds = 3
span_hours = 240
expect.scaffold = { min_precision = 1.0, min_recall = 1.0 }
expect.candidate_fleet = { min_precision = 1.0, min_recall = 1.0 }
[[scenario.actor]]
kind = "fleet"
agents = 3
records = 8
[[scenario.actor]]
kind = "fleet"
agents = 3
records = 8
offset_hours = 6
[[scenario.actor]]
kind = "mimic"
bridges = [0, 1]
agents = 1
records = 8
offset_hours = 12
[[scenario.actor]]
kind = "agent"
agents = 250
retry = 0.2
palette_share = 0.1

# A scaffold fleet among many other agents. Its third member makes each
# shared shape's base rate at least 2 / (n - 1), so the pairs only pass the
# false-discovery cut over the pairs compared with a few hundred comparable
# clusters; among a few dozen (fleet, fleet-traffic) they do not.
[[scenario]]
name = "fleet-crowd"
seed = 261
seeds = 4
span_hours = 240
expect.scaffold = { min_precision = 0.92, min_recall = 1.0 }
expect.candidate_fleet = { min_precision = 0.92, min_recall = 1.0 }
[[scenario.actor]]
kind = "fleet"
agents = 3
records = 8
[[scenario.actor]]
kind = "agent"
agents = 250
retry = 0.2
palette_share = 0.1

