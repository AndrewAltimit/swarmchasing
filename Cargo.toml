[workspace]
resolver = "3"
members = ["crates/sc-core", "crates/sc-collect", "crates/swarmchase", "crates/sc-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Unlicense"
repository = "https://github.com/AndrewAltimit/swarmchasing"

[workspace.dependencies]
sc-core = { path = "crates/sc-core" }
sc-collect = { path = "crates/sc-collect" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
url = "2"
base64 = "0.22"
percent-encoding = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = 3

[profile.release.package.sc-wasm]
opt-level = "s"

# CI's test profile: release optimisation without fat LTO, so a relink after a
# small change stays fast. Shipped binaries and the WASM bundle stay on `release`.
[profile.release-test]
inherits = "release"
lto = false
codegen-units = 16
