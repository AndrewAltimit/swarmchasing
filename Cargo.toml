[workspace]
resolver = "3"
members = ["crates/sc-core", "crates/sc-collect", "crates/sc-case", "crates/sc-stix", "crates/sc-publish", "crates/swarmchase", "crates/sc-wasm", "crates/sc-rules-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Unlicense"
publish = false
repository = "https://github.com/AndrewAltimit/swarmchasing"

[workspace.dependencies]
# Every member takes its dependencies from this table (`foo.workspace = true`),
# so one version and one feature set is pinned per crate.

# Workspace crates.
sc-core = { path = "crates/sc-core" }
sc-collect = { path = "crates/sc-collect" }
sc-publish = { path = "crates/sc-publish" }
sc-case = { path = "crates/sc-case" }
sc-stix = { path = "crates/sc-stix" }

# External crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Trimmed for the browser module: case folding and \w \d \s \b (what rule
# patterns use) and the lazy DFA, without the Unicode property tables and the
# literal prefilters, which would put the module over its size budget. Native
# builds get the default features back through sc-publish (see its manifest).
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "perf-dfa"] }
url = "2"
base64 = "0.22"
percent-encoding = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
wasm-bindgen = "0.2"
age = "0.11"
tar = { version = "0.4", default-features = false }
flate2 = "1"
psl = "2"

[profile.release]
lto = true
opt-level = 3

# The WASM module builds on `release` with size settings (opt-level "z", one
# codegen unit, panic=abort) set by scripts/ci/build-site.sh through
# CARGO_PROFILE_RELEASE_* variables, so they never reach native binaries.

# CI's test profile: release optimisation without fat LTO, so a relink after a
# small change stays fast. Shipped binaries and the WASM bundle stay on `release`.
[profile.release-test]
inherits = "release"
lto = false
codegen-units = 16
