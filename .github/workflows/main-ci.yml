---
# CI + GitHub Pages deploy for swarmchasing. Modelled on legend-of-legaia-re's
# main-ci.yml (same self-hosted runner convention):
#   - Every run starts with `gates`: the seconds-long repo gates (committed
#     data, doc links, doc density, site safety, supply chain). The cargo job
#     `ci` needs it, so a committed dump or a broken link fails the run before
#     the runner spends minutes on clippy and the tests. Without the `needs`
#     edge the single-slot runner picks jobs in any order, and the fast gates
#     can end up queued behind the slow ones.
#   - `ci` runs the same steps on pull requests, pushes to main and manual
#     dispatch: fmt, clippy, tests, the detection eval gate, notice lint and a
#     wasm32 type-check. A green PR means the tests passed.
#   - Pull requests from forks run NOTHING. The runner is a self-hosted box
#     shared with other workloads, and a fork PR is arbitrary code. Also turn
#     on Settings > Actions > "Require approval for all outside collaborators".
#   - cargo runs directly on the runner (Ubuntu arm64, DGX Spark).
#   - `deploy-pages` builds the site (the WASM modules, then every page from
#     committed inputs, into `_site/`) and publishes it after `gates` and
#     `ci` pass on main. Settings > Pages > Source
#     must be "GitHub Actions".
#   - watch.yml is separate: it is cron-driven, never touches Pages, and
#     builds its own release binary into the shared cargo cache.
#
# Repository variables read here (Settings > Secrets and variables > Actions >
# Variables):
#   SWARMCHASE_REQUIRE_BROWSER  'true' makes the site XSS check fatal when no
#                               Chrome is installed on the runner. Unset, a
#                               missing browser skips the check with a warning.

name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# A PR push supersedes the previous push's run; pushes to main keep one group
# per commit and never cancel, so every commit on main gets a full result.
concurrency:
  group: main-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every cargo job narrows CARGO_TARGET_DIR to a per-toolchain cache outside the
# checkout (scripts/ci/select-ci-target-dir.sh). `actions/checkout` with
# `clean: true` deletes the gitignored target/, so without it every run would
# rebuild the workspace from cold. The cache defaults to
# ~/.cache/swarmchase-ci-target for the runner user.

jobs:
  # -- Repository Gates -------------------------------------------------------
  # The scripts/ci/check-*.py gates also run from scripts/git-hooks/pre-commit,
  # but a gate that lives only in a hook is one skipped install away from being
  # fiction. Separate job, not a step of `ci`: these take seconds, so a broken
  # doc link or a committed dump reports in seconds rather than behind clippy.
  gates:
    name: Repo Gates
    runs-on: self-hosted
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: true

      # The one hard rule: no raw dumps, no unredacted secrets. The gate
      # self-tests its detectors and refuses to pass when a control fails.
      - name: Committed data (no dumps, no live secrets)
        run: python3 scripts/ci/check-committed-data.py

      # The bundled rules file against the published SC-Rules v1 schema, so a
      # field the schema does not know (or a missing one) fails here, not in
      # someone else's tooling. Stdlib only.
      - name: Rules schema (SC-Rules v1)
        run: python3 scripts/ci/check-rules-schema.py

      - name: Doc links + heading anchors
        run: python3 scripts/ci/check-md-links.py

      # Long lines and paragraphs inside table cells, across docs/, the crate
      # READMEs and the top-level pages (CLAUDE.md included). The self-test
      # runs first so a broken detector cannot report a vacuous pass.
      - name: Doc density
        run: |
          python3 scripts/ci/check-doc-density.py --self-test
          python3 scripts/ci/check-doc-density.py

      # The site renders attack payloads: strict CSP, no HTML parsing of strings.
      - name: Site safety (CSP, no HTML sinks)
        run: python3 scripts/ci/check-site.py

      # A tag a notice prints is public and anyone can copy it, so it must be
      # in [linking] published_tags or it would still link clusters.
      - name: Published tags (burned identifiers)
        run: |
          python3 scripts/ci/check-published-tags.py --self-test
          python3 scripts/ci/check-published-tags.py

      # RustSec advisories (vulnerable, unmaintained, yanked), permissive
      # licenses only, crates.io as the only source, no wildcard versions.
      # The first run on a runner installs the pinned cargo-deny.
      - name: Supply chain (cargo-deny)
        run: scripts/ci/deny.sh

  # -- Cargo CI ---------------------------------------------------------------
  # Same steps for pull requests and main. `needs: gates` orders the jobs on
  # the single-slot runner and skips this job when the gates fail; it also
  # inherits the gates' fork guard (a skipped need skips the dependant), and
  # the `if` restates it so the guard does not hang on that implicit rule.
  ci:
    name: Swarmchase CI
    needs: [gates]
    runs-on: self-hosted
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: true

      - name: Select per-toolchain target dir
        run: scripts/ci/select-ci-target-dir.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      # `release-test` is release optimisation without fat LTO (Cargo.toml).
      # The eval gate and notice lint below reuse its build, so the profile
      # is compiled once per run.
      - name: Test
        run: cargo test --workspace --profile release-test

      # Precision/recall floors on samples/eval/. With no embargo a
      # false positive goes public within a day of being acted on, so a rules change
      # that costs precision fails here.
      - name: Detection eval gate
        run: scripts/ci/eval-gate.sh --profile release-test

      # Every committed notice: valid front matter and updates, and nothing a
      # notice withholds (callback channels, addresses, credential shapes).
      - name: Notices (nothing withheld leaks)
        run: cargo run -q --profile release-test -p swarmchase -- notice lint

      # The browser half of the toolkit: cfg(wasm32) code and wasm-only
      # dependency features that no host build compiles.
      - name: wasm32 type-check
        run: scripts/ci/check-wasm-target.sh

      # No `cargo build --release` here. Nothing in this workflow runs a
      # release binary, and watch.yml's `cargo run --release` builds and
      # caches its own (the cache is shared), so a warm-up build would only
      # cost minutes on every push.

  # -- Deploy GitHub Pages ----------------------------------------------------
  deploy-pages:
    name: Deploy GitHub Pages
    needs: [gates, ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: true

      - name: Select per-toolchain target dir
        run: scripts/ci/select-ci-target-dir.sh

      # The WASM modules, then every page into _site/ (scripts/ci/build-site.sh).
      # wasm-pack builds without optimising; the script runs wasm-opt itself
      # and caches the result outside the checkout, keyed by the hash of the
      # unoptimised module, so a deploy that did not change the Rust skips
      # the multi-minute optimiser pass. It fails when the analysis module is
      # over 1.5 MiB, when a notice fails its check, when a page breaks the
      # site policy (check-site.py), or when the build read anything that is
      # not a committed site input (nothing under data/ or $SWARMCHASE_DATA).
      - name: Build site
        run: |
          owner="$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")"
          SITE_BASE_URL="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/" scripts/ci/build-site.sh

      # Every release module the site loads: the analysis engine, the
      # on-demand tools module (report drafts, bundle checks) and the rules
      # converter. build-site.sh enforces each budget; this only reports.
      - name: WASM module sizes
        run: |
          for f in site/pkg/sc_wasm_bg.wasm site/pkg/tools/sc_tools_bg.wasm site/pkg-rules/sc_rules_wasm_bg.wasm; do
            size=$(stat -c %s "$f")
            echo "$f: $size bytes"
            echo "$(basename "$f"): $(( size / 1024 )) KiB" >> "$GITHUB_STEP_SUMMARY"
          done

      # No generated page may run anything a notice, record, claim or edited
      # rule carries: the check builds the site again with a hostile notice
      # and drives every page in headless Chrome. Fatal when a browser is
      # installed. With no Chrome (exit 2) it is skipped with a
      # warning, unless the repo variable SWARMCHASE_REQUIRE_BROWSER is
      # 'true': then a runner that lost its browser fails the deploy instead
      # of publishing an unchecked page.
      - name: Site XSS check (headless Chrome)
        env:
          REQUIRE_BROWSER: ${{ vars.SWARMCHASE_REQUIRE_BROWSER }}
        run: |
          rc=0; node scripts/site-xss-check.mjs || rc=$?
          if [ "$rc" -eq 2 ]; then
            if [ "$REQUIRE_BROWSER" = "true" ]; then
              echo "::error::site XSS check could not run (no Chrome or no site/pkg) and SWARMCHASE_REQUIRE_BROWSER is true"
              exit 1
            fi
            echo "::warning::site XSS check skipped: no Chrome on the runner"
            exit 0
          fi
          exit "$rc"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # -- CI Summary -------------------------------------------------------------
  notify:
    name: CI Summary
    needs: [gates, ci, deploy-pages]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    env:
      GATES: ${{ needs.gates.result }}
      CI: ${{ needs.ci.result }}
      PAGES: ${{ needs.deploy-pages.result }}
    steps:
      - name: Generate summary
        run: |
          status() { case "$1" in success) echo pass;; skipped) echo skipped;; *) echo FAIL;; esac; }
          {
            echo "## Main CI Summary"
            echo ""
            echo "**Commit**: ${{ github.sha }}"
            echo "**Branch**: ${{ github.ref_name }}"
            echo ""
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| Repo Gates | $(status "$GATES") |"
            echo "| CI | $(status "$CI") |"
            echo "| GitHub Pages | $(status "$PAGES") |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$GATES" "$CI" "$PAGES"; do
            if [[ "$r" == failure ]]; then
              echo "CI failed - please review the logs" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
