---
# Scheduled watch: every 6 hours (and on demand) pull what is new from the
# sources in watchlist.toml, analyse the recent window, and email the admin a
# digest when something changed. Unreviewed leads never leave the runner except
# in that email (see the note at the end of the job).

name: watch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      init:
        # The first run on a runner: the watch refuses a data directory
        # that holds no watch data unless told to start one, so a wrong
        # SWARMCHASE_DATA never starts a fresh store beside the real one.
        description: "Start a new data directory (first run on this runner only)"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time: runs share the state file and record store.
concurrency:
  group: watch
  cancel-in-progress: false

env:
  # Outside the checkout: actions/checkout cleans untracked files in the
  # workspace, which would wipe the cursors and record store between runs.
  # Defaults to ~/swarmchase-data for the runner user; override with a repo variable.
  SWARMCHASE_DATA: ${{ vars.SWARMCHASE_DATA }}
  # Email is optional. Without SMTP_URL the run still writes its digest; it just isn't mailed.
  SMTP_URL: ${{ secrets.SMTP_URL }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  MAIL_FROM: ${{ secrets.MAIL_FROM }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  # If it is missing, urlquery sources are skipped and the digest says so.
  URLQUERY_APIKEY: ${{ secrets.URLQUERY_APIKEY }}
  # The job's own token, read-only (`permissions` above), for the GitHub
  # search source; it searches public pull requests and commits only.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Opt-in model triage, a label suggestion on each new lead. Unset, no
  # model is asked.
  # - `local` (or `true`) asks a model server on the runner or its private
  #   network. The URL must be loopback, private or link-local; any other
  #   host is refused before anything is sent.
  # - `claude` runs Claude Code headless with the runner user's own login
  #   (the admin's subscription, in ~/.claude); no secret is needed or
  #   passed. It is sent only leads from public web archive and urlquery
  #   records, defanged, without IP addresses. Setup: docs/reference/runner.md.
  SWARMCHASE_WATCH_TRIAGE: ${{ vars.SWARMCHASE_WATCH_TRIAGE }}
  SWARMCHASE_LLM_URL: ${{ vars.SWARMCHASE_LLM_URL }}
  SWARMCHASE_LLM_MODEL: ${{ vars.SWARMCHASE_LLM_MODEL }}
  SWARMCHASE_CLAUDE_MODEL: ${{ vars.SWARMCHASE_CLAUDE_MODEL }}
  CLAUDE_PATH: ${{ vars.CLAUDE_PATH }}

jobs:
  watch:
    runs-on: [self-hosted]
    # A host answering HTTP 503 gets ten minutes of retries once per run,
    # then is skipped for the rest of it; the margin covers that on top of
    # an ordinary run.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: true

      # Shares main-ci.yml's persistent cargo cache, so a scheduled run only
      # rebuilds when the code changed.
      - name: Select per-toolchain target dir
        run: scripts/ci/select-ci-target-dir.sh

      # `--profile release-test` is the profile main-ci.yml's tests build,
      # in the same cache, so after a push to main the watch reuses that
      # build instead of linking a fat-LTO release binary of its own. The
      # step writes `changed`, `priority` and `run_dir` to $GITHUB_OUTPUT
      # for the email steps below. A failed source, an unavailable host or a
      # failed canary sets `changed`, so the digest carrying the alert is
      # mailed the same run.
      #
      # The Actions log of a public repository is public, and the watch's
      # output describes unreviewed leads (counts by network, operator
      # clocks). The full output goes to $RUNNER_TEMP/watch.log on the
      # runner and never to stdout (the failure alert mails its tail). The
      # public log gets only `--public-log`, which the watch builds from an
      # allowlist: each source's name, kind, status, counts and duration,
      # and the totals. Nothing in it comes from a record or a lead.
      - name: Collect and analyse
        id: watch
        env:
          INIT: ${{ inputs.init && '--init' || '' }}
        run: |
          export SWARMCHASE_DATA="${SWARMCHASE_DATA:-$HOME/swarmchase-data}"
          public="$RUNNER_TEMP/watch-public.txt"
          rm -f "$public"
          set +e
          cargo run --profile release-test -p swarmchase -- watch watchlist.toml $INIT \
            --public-log "$public" > "$RUNNER_TEMP/watch.log" 2>&1
          rc=$?
          set -e
          if [ -s "$public" ]; then
            cat "$public"
          else
            echo "no public summary: the run stopped before writing it (exit $rc); the failure alert mails the log's tail"
          fi
          exit "$rc"

      # The subject leads with the run's priority (high, medium or low).
      # Mailed whenever the run wrote a changed digest, even when the watch
      # then exited non-zero (every source failed): that digest carries the
      # alerts.
      - name: Email digest
        if: always() && steps.watch.outputs.changed == 'true' && env.SMTP_URL != ''
        env:
          PRIORITY: ${{ steps.watch.outputs.priority }}
          RUN_DIR: ${{ steps.watch.outputs.run_dir }}
        run: |
          bash scripts/ci/send-mail.sh "[swarmchase] [${PRIORITY^^}] watch digest $(basename "$RUN_DIR")" \
            "$RUN_DIR/digest.md"

      - name: Email failure alert
        if: (failure() || cancelled()) && env.SMTP_URL != ''
        run: |
          {
            echo "The scheduled watch run failed."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Last lines of the log:"
            tail -n 40 "$RUNNER_TEMP/watch.log" 2>/dev/null || echo "(no log)"
          } > "$RUNNER_TEMP/alert.txt"
          bash scripts/ci/send-mail.sh "[swarmchase] watch run FAILED" "$RUNNER_TEMP/alert.txt"

      # No artifact upload: artifacts on a public repo are downloadable by anyone,
      # and these are unreviewed leads. They stay in $SWARMCHASE_DATA on the runner
      # and reach the admin only through the digest email.
