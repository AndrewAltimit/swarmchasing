# Declared agent identities: the agent products that name themselves in their
# requests, the address-range files and Web Bot Auth key directories their
# providers publish, and where each provider documents them.
#
# Compiled into sc-core (`sc_core::identity::Catalog::bundled`) and read by
# `swarmchase identity`. The range files and key directories themselves are
# data: `swarmchase identity refresh` fetches them from the URLs below into
# `<data>/identity/`, and they are never committed.
#
# Every URL here comes from the provider's own documentation (`source`). The
# collector fetches only these URLs, never a `Signature-Agent` value seen in a
# request: that address is agent-supplied (FM-2.1, FM-7.11). Adding an entry is
# a review decision: cite the provider's page that names the file.
#
# Fields:
#   [[range_file]]  id, provider, url, source; `exhaustive = false` when the
#                   provider does not say the file lists every address its
#                   agents use, so an address outside it is unlisted, not spoofed.
#   [[directory]]   id, provider, signature_agent (the `Signature-Agent` URI the
#                   provider documents), url (its key directory), source;
#                   `access = "direct" | "intermediary"` only where the
#                   provider's own documentation says how the signer is
#                   operated (one operator, or a platform many end users
#                   direct). An intermediary's verified signature attributes
#                   the platform, not the end user.
#   [[agent]]       token (the user-agent product token, matched
#                   case-insensitively as a whole token), provider, product,
#                   purpose (user_fetch | agent | search | training),
#                   ranges (range_file ids), directory (directory id, when the
#                   product signs), source.
#   [[github_app]]  login (the actor login GitHub events carry, matched
#                   case-insensitively and whole), provider, product, names
#                   (words that claim the product in another App's login),
#                   source. Read by the platform pass: these Apps' events are
#                   tallied, not grouped, and an undeclared `[bot]` login
#                   carrying one of the names is a spoofing lead.

[meta]
version = "2026-10-14.1"

# ── OpenAI ────────────────────────────────────────────────────────────────
# https://developers.openai.com/api/docs/bots lists each user agent with its
# published range file.

[[range_file]]
id = "openai.chatgpt-user"
provider = "OpenAI"
url = "https://openai.com/chatgpt-user.json"
source = "https://developers.openai.com/api/docs/bots"

[[range_file]]
id = "openai.searchbot"
provider = "OpenAI"
url = "https://openai.com/searchbot.json"
source = "https://developers.openai.com/api/docs/bots"

[[range_file]]
id = "openai.gptbot"
provider = "OpenAI"
url = "https://openai.com/gptbot.json"
source = "https://developers.openai.com/api/docs/bots"

# ChatGPT agent signs its requests with Web Bot Auth and sends
# `Signature-Agent: "https://chatgpt.com"`; it uses a browser user agent, so
# the signature is its only declaration. The help article's earlier
# `-chatgpt-agent-allowlisting` slug redirects to the one below.
[[directory]]
id = "openai.chatgpt"
provider = "OpenAI"
signature_agent = "https://chatgpt.com"
url = "https://chatgpt.com/.well-known/http-message-signatures-directory"
source = "https://help.openai.com/en/articles/11845367-chatgpt-works-cloud-browser-allowlisting"

# https://developers.openai.com/api/docs/guides/ip-addresses publishes the
# egress ranges of ChatGPT integrations (connectors, GPT Actions, agentic
# shopping) and of Codex cloud. No user-agent token is tied to them, and the
# page says the ranges change without calling them complete.
[[range_file]]
id = "openai.chatgpt-connectors"
provider = "OpenAI"
url = "https://openai.com/chatgpt-connectors.json"
source = "https://developers.openai.com/api/docs/guides/ip-addresses"
exhaustive = false

[[range_file]]
id = "openai.chatgpt-agents"
provider = "OpenAI"
url = "https://openai.com/chatgpt-agents.json"
source = "https://developers.openai.com/api/docs/guides/ip-addresses"
exhaustive = false

[[agent]]
token = "ChatGPT-User"
provider = "OpenAI"
product = "ChatGPT user-triggered fetches"
purpose = "user_fetch"
ranges = ["openai.chatgpt-user"]
directory = "openai.chatgpt"
source = "https://developers.openai.com/api/docs/bots"

[[agent]]
token = "OAI-SearchBot"
provider = "OpenAI"
product = "ChatGPT search crawler"
purpose = "search"
ranges = ["openai.searchbot"]
source = "https://developers.openai.com/api/docs/bots"

[[range_file]]
id = "openai.adsbot"
provider = "OpenAI"
url = "https://openai.com/adsbot.json"
source = "https://developers.openai.com/api/docs/bots"

# OAI-AdsBot validates the safety of pages submitted as ads on ChatGPT. The
# purpose enum has no ad-validation value; `search` is the closest (an
# automated crawler visiting submitted pages); the product line says what it
# does.
[[agent]]
token = "OAI-AdsBot"
provider = "OpenAI"
product = "ChatGPT ad-page safety validation"
purpose = "search"
ranges = ["openai.adsbot"]
source = "https://developers.openai.com/api/docs/bots"

[[agent]]
token = "GPTBot"
provider = "OpenAI"
product = "OpenAI training crawler"
purpose = "training"
ranges = ["openai.gptbot"]
source = "https://developers.openai.com/api/docs/bots"

