# ── Google ────────────────────────────────────────────────────────────────
# https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers
# gives Google-Agent its own range file, and
# https://developers.google.com/crawling/docs/crawlers-fetchers/web-bot-auth
# says some Google-Agent requests are signed, with `Signature-Agent:
# g="https://agent.bot.goog"` and the directory below.

[[range_file]]
id = "google.user-triggered-agents"
provider = "Google"
url = "https://developers.google.com/static/crawling/ipranges/user-triggered-agents.json"
source = "https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers"

[[directory]]
id = "google.agent"
provider = "Google"
signature_agent = "https://agent.bot.goog"
url = "https://agent.bot.goog/.well-known/http-message-signatures-directory"
source = "https://developers.google.com/crawling/docs/crawlers-fetchers/web-bot-auth"

[[agent]]
token = "Google-Agent"
provider = "Google"
product = "Google agents acting on a user's request"
purpose = "agent"
ranges = ["google.user-triggered-agents"]
directory = "google.agent"
source = "https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers"

# The user-triggered fetchers share these two range files (Google-owned
# fetchers resolve under *.gae.googleusercontent.com, user-owned under
# google-proxy-*.google.com). The page does not map each fetcher to one file
# and names three files in all, so neither is taken as exhaustive.
[[range_file]]
id = "google.user-triggered-fetchers"
provider = "Google"
url = "https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers.json"
source = "https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers"
