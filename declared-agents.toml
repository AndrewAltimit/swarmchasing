# ── Hosted-browser signers (key directories only) ───────────────────────────
# Services that drive a browser on a user's behalf and sign their requests
# with Web Bot Auth. No user-agent product token is tracked for them; the
# signature and its key directory are the declaration. A service whose public
# docs do not give its Signature-Agent value and directory URL (Browserbase's
# Web Bot Auth page gives neither) is left out until they do.

# Cloudflare Browser Rendering signs its browser traffic and documents the
# Signature-Agent host and key directory.
[[directory]]
id = "cloudflare.browser-rendering"
provider = "Cloudflare"
signature_agent = "https://web-bot-auth.cloudflare-browser-rendering-085.workers.dev"
url = "https://web-bot-auth.cloudflare-browser-rendering-085.workers.dev/.well-known/http-message-signatures-directory"
source = "https://developers.cloudflare.com/browser-rendering/reference/automatic-request-headers/"

