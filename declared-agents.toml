provider = "Google"
product = "Pinpoint fetches of sources a user adds to a collection"
purpose = "user_fetch"
ranges = ["google.user-triggered-fetchers", "google.user-triggered-fetchers-google"]
source = "https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers"

