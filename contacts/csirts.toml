# National CSIRTs, one per country, from FIRST's public team directory
# (https://www.first.org/members/teams/).
#
# `swarmchase case contacts` proposes the national CSIRT of each affected
# endpoint's country, read from the host's country-code top-level domain
# (`tlds`, default the lowercased `country`) or given with `--country`.
# Contacts it adds carry role `csirt`. FIRST publishes these addresses for
# incident response only; nothing here is ever used to send anything.
#
# Every address was read from its `source` page on the `verified` date.
# Add an entry only the same way, never guess an address, and leave out a
# team whose page lists no address or only a named person's.

[[csirt]]
country = "AT"
name = "CERT.at"
official = "National Computer Emergency Response Team of Austria"
channel = "email"
address = "team@cert.at"
source = "https://www.first.org/members/teams/cert-at"
verified = "2026-10-10"

