# Security and abuse channels of AI providers and agent hosts.
#
# `swarmchase case contacts` adds a provider's entries to a case when one of
# the case's developer or host claims names it (by `name` or an alias, case
# insensitive). `swarmchase contacts verify` re-reads every source and drafts
# the changes; nothing here is ever used to send anything.
#
# Every contact was read, address and all, from its `source` on the
# `verified` date. Add an entry only the same way, and never guess an
# address. `purpose` is `security` (vulnerabilities, incidents) or `abuse`
# (misuse of the service); reports about a provider's agents go to abuse
# first where there is one.

[[provider]]
name = "OpenAI"
aliases = ["openai", "chatgpt", "gpt", "codex"]
kind = "model"
[[provider.contact]]
channel = "email"
address = "disclosure@openai.com"
purpose = "security"
source = "https://openai.com/.well-known/security.txt"
verified = "2026-10-10"
[[provider.contact]]
channel = "portal"
address = "https://bugcrowd.com/openai"
purpose = "security"
source = "https://openai.com/.well-known/security.txt"
verified = "2026-10-10"

