[package]
name = "sc-wasm"
description = "WebAssembly bindings for sc-core, used by the GitHub Pages toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sc-core.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[build-dependencies]
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
sc-rules-wasm = { path = "../sc-rules-wasm" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
