[package]
name = "sc-wasm"
description = "WebAssembly bindings for sc-core, used by the GitHub Pages toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Two modules from one crate: `engine` (the default) is what every analysis
# page loads; `tools` (report drafts, bundle check, labelled eval) loads only
# on demand. scripts/ci/build-site.sh builds each with its own size budget.
[features]
default = ["engine"]
engine = []
# The tools module verifies Web Bot Auth signatures (identity checks).
tools = ["sc-core/signatures"]

[dependencies]
sc-case.workspace = true
sc-core.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[build-dependencies]
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
sc-rules-wasm = { path = "../sc-rules-wasm" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--gufa", "-Oz", "--converge", "--strip-producers"]
