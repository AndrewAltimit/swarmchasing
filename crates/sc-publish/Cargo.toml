[package]
name = "sc-publish"
description = "Public notices as files, and the static site and feed built from them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
sc-core.workspace = true
sc-case = { workspace = true, features = ["signatures"] }
serde.workspace = true
sha2.workspace = true
chrono.workspace = true
flate2.workspace = true
serde_json.workspace = true
toml.workspace = true
# Not used here. The workspace trims regex for the browser module, and every
# native build (the CLI, the site generator, the workspace tests) includes
# this crate, so this line gives them regex's default features back: Unicode
# property classes such as \p{L} in edited rules, and the literal prefilters.
regex = { workspace = true, features = ["default"] }
