[package]
name = "swarmchase"
description = "CLI for finding, linking and reporting AI agent activity in public records"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
sc-core.workspace = true
sc-collect.workspace = true
sc-publish.workspace = true
sc-case.workspace = true
sc-stix.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
base64.workspace = true
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
age.workspace = true
tar.workspace = true
chrono = { workspace = true, features = ["clock"] }

[dev-dependencies]
regex.workspace = true
